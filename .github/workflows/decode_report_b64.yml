name: Decode Report Base64

on:
  push:
    branches: [ "main" ]
    paths:
      - "Report/**/*.b64"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode .b64 files into binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          root = Path('Report')
          if not root.exists():
            raise SystemExit(0)

          b64_files = sorted(root.rglob('*.b64'))
          if not b64_files:
            raise SystemExit(0)

          for p in b64_files:
            out = p.with_suffix('')  # remove .b64
            data = p.read_text(encoding='utf-8').strip()
            out.parent.mkdir(parents=True, exist_ok=True)
            out.write_bytes(base64.b64decode(data))
            p.unlink()

          print(f"Decoded {len(b64_files)} files")
          PY

      - name: Commit decoded artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[decoded] materialize report binaries"
            git push
          else
            echo "No changes"
          fi
