name: Generate Daily Report Artifacts

on:
  # 05:30 WIB = 22:30 UTC — generate poster/PDF dari source yg sudah siap
  schedule:
    - cron: "30 22 * * *"
  push:
    branches: ["main"]
    paths:
      - "Report/**/source/**"
      - "tools/generate_from_json_parts.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode generate: latest | date | range | all"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - date
          - range
          - all
      issue_date:
        description: "Jika mode=date, isi YYYY-MM-DD"
        required: false
        default: ""
      from_date:
        description: "Jika mode=range, awal YYYY-MM-DD"
        required: false
        default: ""
      to_date:
        description: "Jika mode=range, akhir YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-report-artifacts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow reportlab

      - name: Generate artifacts (selected issues)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "all" ]; then
              python tools/generate_from_json_parts.py --root Report --all
            elif [ "$MODE" = "date" ]; then
              python tools/generate_from_json_parts.py --root Report --issue-date "${{ inputs.issue_date }}"
            elif [ "$MODE" = "range" ]; then
              python tools/generate_from_json_parts.py --root Report --from-date "${{ inputs.from_date }}" --to-date "${{ inputs.to_date }}"
            else
              python tools/generate_from_json_parts.py --root Report
            fi
          else
            # Default on push: only generate for the latest issue date in repo.
            python tools/generate_from_json_parts.py --root Report
          fi

      - name: Update README (replace Today Updates)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          OWNER = "mirfansulaiman"
          REPO = "cyber_news_daily_updates"
          BRANCH = "main"
          RAW_BASE = f"https://raw.githubusercontent.com/{OWNER}/{REPO}/{BRANCH}"

          report_root = Path("Report")
          meta_paths = sorted(report_root.glob("*/????-??-??/source/meta.json"))
          if not meta_paths:
            raise SystemExit("No meta.json found under Report/**/source/. Cannot update README.")

          issues = []
          for mp in meta_paths:
            try:
              meta = json.loads(mp.read_text(encoding="utf-8"))
              issue_date = str(meta.get("issue_date") or "").strip()
              vol = str(meta.get("vol") or "").strip()
              issue_time_wib = str(meta.get("issue_time_wib") or "").strip()
              if issue_date and vol:
                issues.append((issue_date, vol, issue_time_wib))
            except Exception:
              continue

          if not issues:
            raise SystemExit("meta.json files exist but none are parseable with issue_date+vol.")

          issue_date, vol, issue_time_wib = sorted(issues, key=lambda x: x[0])[-1]
          year = issue_date[:4]
          issue_tag = f"issue-{vol}"

          issue_dir = report_root / year / issue_date
          source_dir = issue_dir / "source"

          # Gate: only update README when source data is complete AND artifacts exist in this workspace.
          required = [
            source_dir / "meta.json",
            source_dir / "highlights.json",
            source_dir / "threat_intel.json",
            source_dir / "vulnerabilities.json",
            source_dir / "data_breach.json",
            source_dir / "readme_summary.json",
          ]
          missing = [p for p in required if not p.exists()]
          if missing:
            print("README skip: incomplete source inputs:", [p.name for p in missing])
            raise SystemExit(0)

          # Summaries are generated by the data-only generator and stored as JSON.
          # This avoids README drift and prevents "append" duplication.
          summary_path = source_dir / "readme_summary.json"
          if summary_path.exists():
            s = json.loads(summary_path.read_text(encoding="utf-8"))
            p1 = "Today's highlights are led by exploit-ready vulnerabilities: " + str(s.get("highlights_led_by_exploit_ready_vulns") or "").strip()
            p2 = "Endpoint posture is also under pressure: " + str(s.get("endpoint_posture_under_pressure") or "").strip()
            p3 = "Identity and edge access risks remain elevated: " + str(s.get("identity_and_edge_access_risks") or "").strip()
          else:
            # Backward-compatible fallback (older issues may not have readme_summary.json)
            highlights = json.loads((source_dir / "highlights.json").read_text(encoding="utf-8"))
            h = [str(x).strip() for x in highlights[:5]]
            while len(h) < 5:
              h.append("")
            p1 = (
              "Today's highlights are led by exploit-ready vulnerabilities: "
              f"{h[0]} and {h[1]}. "
              "Treat newly published PoCs and early exploitation signals as immediate patch/mitigation triggers for internet-facing and fleet-wide infrastructure."
            )
            p2 = (
              "Endpoint posture is also under pressure: "
              f"{h[2]}. "
              "Public privilege-escalation PoCs can rapidly turn initial access into full SYSTEM/root control, so monitoring and least-privilege hardening remain critical."
            )
            p3 = (
              "Identity and edge access risks remain elevated: "
              f"{h[3]}, plus {h[4]}. "
              "Prioritize OAuth/conditional-access hardening and minimize management-plane exposure on network control components."
            )

          cover = f"{RAW_BASE}/Report/{year}/{issue_date}/poster_{issue_date}_{issue_tag}.jpg"
          poster_vul = f"{RAW_BASE}/Report/{year}/{issue_date}/poster_vulnerabilities_{issue_date}_{issue_tag}.jpg"
          poster_ti = f"{RAW_BASE}/Report/{year}/{issue_date}/poster_threat-intel_{issue_date}_{issue_tag}.jpg"
          poster_db = f"{RAW_BASE}/Report/{year}/{issue_date}/poster_data-breach_{issue_date}_{issue_tag}.jpg"
          pdf = f"{RAW_BASE}/Report/{year}/{issue_date}/cyber_newsletter_{issue_date}.pdf"

          # Ensure local artifacts exist (they are created earlier in this job).
          pdf_local = issue_dir / f"cyber_newsletter_{issue_date}.pdf"
          cover_local = issue_dir / f"poster_{issue_date}_{issue_tag}.jpg"
          vul_local = issue_dir / f"poster_vulnerabilities_{issue_date}_{issue_tag}.jpg"
          ti_local = issue_dir / f"poster_threat-intel_{issue_date}_{issue_tag}.jpg"
          db_local = issue_dir / f"poster_data-breach_{issue_date}_{issue_tag}.jpg"
          missing_artifacts = [p.name for p in [pdf_local, cover_local, vul_local, ti_local, db_local] if not p.exists()]
          if missing_artifacts:
            print("README skip: artifacts not generated yet:", missing_artifacts)
            raise SystemExit(0)

          # Replace content between markers (no append).
          start = "<!-- DAILY_UPDATES_START -->"
          end = "<!-- DAILY_UPDATES_END -->"
          new_block = "\n".join(
            [
              start,
              f"## Today Updates: [Vol. {vol} | {issue_date} {issue_time_wib}]",
              "",
              p1,
              "",
              p2,
              "",
              p3,
              "",
              f"![Cover Poster]({cover})",
              "",
              "### TOP 10 - VULNERABILITIES",
              "",
              f"![Top 10 Vulnerabilities]({poster_vul})",
              "",
              "### TOP 10 - THREAT INTEL",
              "",
              f"![Top 10 Threat Intel]({poster_ti})",
              "",
              "### TOP 10 - DATA BREACH & CYBERCRIME",
              "",
              f"![Top 10 Data Breach & Cybercrime]({poster_db})",
              "",
              "### PDF Report",
              "",
              f"Download: {pdf}",
              "",
              end,
              "",
            ]
          ).rstrip() + "\n"

          readme_path = Path("README.md")
          text = readme_path.read_text(encoding="utf-8") if readme_path.exists() else "# Cyber News Daily Updates\n\n"

          marker_re = re.compile(
            re.escape(start) + r"[\s\S]*?" + re.escape(end),
            flags=re.MULTILINE,
          )
          matches = list(marker_re.finditer(text))
          if matches:
            # Collapse any previously duplicated DAILY blocks into one fresh block.
            prefix = text[:matches[0].start()].rstrip()
            suffix = text[matches[-1].end():].lstrip()
            parts = []
            if prefix:
              parts.append(prefix)
            parts.append(new_block.strip())
            if suffix:
              parts.append(suffix)
            new_text = "\n\n".join(parts).rstrip() + "\n"
          else:
            # If markers do not exist yet, insert the block before "## Data Source" if present.
            if "\n## Data Source" in text:
              new_text = text.replace("\n## Data Source", "\n\n" + new_block + "\n## Data Source", 1).rstrip() + "\n"
            else:
              new_text = text.rstrip() + "\n\n" + new_block

          readme_path.write_text(new_text.rstrip() + "\n", encoding="utf-8")
          print(f"README updated via DAILY markers for {issue_date} (Vol.{vol}).")
          PY

      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[generate] materialize report artifacts + README"
            git push
          else
            echo "No changes"
          fi
